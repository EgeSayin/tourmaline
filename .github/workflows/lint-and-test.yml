# The checks from the README's Development section, on every push to main and pull request. The release workflow
# runs them too, before it builds the image.
name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npm run lint

      - run: npm run format:check

      # The route types tsc needs, which a build or dev server would otherwise generate.
      - run: npx next typegen

      - run: npx tsc --noEmit -p .

  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and integration tests
            script: test
          - name: End-to-end tests
            script: test:e2e
            browsers: chromium
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The same database and settings a developer uses, so the tests need nothing CI-specific.
      - run: npm run db:up -- --wait

      - run: cp .env.example .env.local

      - if: matrix.browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - run: npm run ${{ matrix.script }}

      - if: failure() && matrix.browsers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.script }}-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
