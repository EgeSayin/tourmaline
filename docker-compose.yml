services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: schedule_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `docker compose up --wait` wait until the database takes connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d schedule_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
